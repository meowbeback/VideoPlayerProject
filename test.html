<!DOCTYPE html>
<html>
<head>
    <title>Тест загрузки файлов</title>
</head>
<body>
    <h1>Тест загрузки файлов</h1>
    <input type="file" id="testFile" accept="video/*">
    <div id="result"></div>

    <script>
        document.getElementById('testFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('result').innerHTML = `
                    <p>Файл выбран: ${file.name}</p>
                    <p>Тип: ${file.type}</p>
                    <p>Размер: ${file.size} байт</p>
                `;
                console.log('Файл выбран:', file);
            }
        });
    </script>
</body>
</html>
